spring.application.name=Microservice-New
server.port=8080
spring.profiles.active=dev

# Primary datasource
spring.datasource.primary.jdbc-url=jdbc:mysql://localhost:3306/microservice_new?useSSL=false&serverTimezone=UTC
spring.datasource.primary.username=root
spring.datasource.primary.password=root
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

# Warehouse datasource
spring.datasource.warehouse.jdbc-url=jdbc:mysql://localhost:3306/restapi?useSSL=false&serverTimezone=UTC
spring.datasource.warehouse.username=root
spring.datasource.warehouse.password=root
spring.datasource.warehouse.driver-class-name=com.mysql.cj.jdbc.Driver